
name: Validacao Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  validar:
    name: Validar Android
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.nome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissao Gradle
        run: chmod +x gradlew

      - name: Definir versao do APK
        id: versao
        if: github.event_name == 'push'
        run: |
          versao=$(bash .github/scripts/proxima-versao.sh "$GITHUB_SHA")
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$versao" >> "$GITHUB_ENV"
          echo "nome=$versao" >> "$GITHUB_OUTPUT"

      - name: Configurar Firebase para o APK
        if: github.event_name == 'push'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON ausente. O APK sera gerado sem acesso ao Firebase."
          fi

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Testes unitarios
        run: ./gradlew testDebugUnitTest

      - name: Compilacao
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK versionado
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pimobiles4-${{ env.ANDROID_VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true

  publicar-tag:
    name: Publicar tag de versao
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar tag no commit validado
        env:
          VERSAO: ${{ needs.validar.outputs.versao }}
        run: |
          test -n "$VERSAO"
          tag="refs/tags/$VERSAO"
          if git show-ref --verify --quiet "$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::A tag $VERSAO já aponta para outro commit."
              exit 1
            fi
            exit 0
          fi
          git push origin "$GITHUB_SHA:$tag"

  docker:
    name: Validar Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Construir a imagem e testar o /status
        shell: bash
        run: |
          # Credencial sintética para iniciar o SDK. A importação fica desativada no teste.
          credencial="$RUNNER_TEMP/firebase-docker-test.json"
          printf '%s\n' '{"type":"authorized_user","client_id":"ci","client_secret":"ci","refresh_token":"ci"}' > "$credencial"
          chmod 644 "$credencial"
          trap 'if [ "$?" -ne 0 ]; then docker logs api-email-ci || true; fi; docker rm -f api-email-ci >/dev/null 2>&1 || true' EXIT

          docker build -t pimobiles4-api-email:ci .
          docker run -d --name api-email-ci -p 127.0.0.1:8080:8080 \
            --mount "type=bind,source=$credencial,target=/run/secrets/firebase.json,readonly" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase.json \
            -e FIREBASE_PROJECT_ID=pimobile-docker-ci \
            -e FIREBASE_USUARIO_UID=usuario-ci \
            -e API_TOKEN=token-de-teste-docker-sem-acesso-real \
            -e IMPORTACAO_CRON=- \
            -e IMAP_HOST=imap.example.invalid \
            -e IMAP_USUARIO=usuario-ci \
            -e IMAP_SENHA=senha-ficticia \
            pimobiles4-api-email:ci

          for tentativa in {1..30}; do
            if resposta=$(curl --fail --silent --max-time 2 http://127.0.0.1:8080/status) \
              && [ "$resposta" = '{"status":"ok"}' ]; then
              echo "A API respondeu ao GET /status."
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' api-email-ci)" != "true" ]; then
              echo "::error::O contêiner da API encerrou antes de responder ao /status."
              exit 1
            fi
            sleep 1
          done

          echo "::error::A API não respondeu com o status esperado após 30 tentativas."
          exit 1
